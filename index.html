<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>~/gemini.sh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">

  <div class="sidebar__scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__dots"><span></span><span></span><span></span></div>
      <div class="sidebar__brand">gemini<span class="dim">.sh</span></div>
    </div>

    <button class="sidebar__new" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
      <span class="kbd">⌘K</span>
    </button>

    <div class="sidebar__label">Chats</div>
    <div class="conv-list" id="convList"></div>

    <div class="sidebar__footer">
      <button class="sidebar__settings-btn" id="settingsBtnSidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="14" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="8" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="16" cy="18" r="2"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <div class="model-badge"><span class="status-dot" id="statusDot"></span><span id="modelBadgeText">gemini-3.7-flash</span></div>
      <div class="topbar__spacer"></div>
      <div class="topbar__title" id="convTitleTop"></div>
      <button class="icon-btn" id="settingsBtnTop" title="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="14" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="8" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="16" cy="18" r="2"/></svg>
      </button>
    </div>

    <div class="messages-wrap" id="messagesWrap">
      <div class="messages" id="messages"></div>
      <button class="scroll-btn" id="scrollBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        Bawah
      </button>
    </div>

    <div class="input-bar">
      <div class="input-shell" id="inputShell">
        <textarea id="input" rows="1" placeholder="Ketik pesan..."></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <div class="input-hint"><span><kbd>Enter</kbd> kirim</span><span><kbd>Shift+Enter</kbd> baris baru</span></div>
    </div>
  </main>

</div>

<!-- Settings Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal__header">
      <h2>Settings</h2>
      <button class="icon-btn" id="modalClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="field">
        <label for="apiKeyInput">Gemini API Key</label>
        <div class="input-row">
          <input type="password" id="apiKeyInput" placeholder="AIza...">
          <button class="btn btn--ghost" id="toggleKeyVisibility" style="flex:0 0 auto;">
            <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint">Belum punya key? Ambil gratis di <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/app/apikey</a>. Key hanya disimpan di storage akunmu dan dikirim langsung ke Google, tidak lewat server lain.</p>
      </div>

      <div class="modal__footer">
        <button class="btn btn--primary" id="saveSettingsBtn">Save</button>
      </div>

      <div class="modal__divider"></div>

      <div class="danger-zone">
        <p>Hapus semua chat &amp; API key yang tersimpan di browser ini.</p>
        <button class="btn btn--danger" id="clearAllBtn">Clear data</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
